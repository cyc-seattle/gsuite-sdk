name: release

on:
  push:
    branches: [main]
  # Re-runs a release whose run failed before semantic-release tagged it.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  release:
    uses: cyc-seattle/.github/.github/workflows/release.yml@v2.4.0
    with:
      image: ghcr.io/cyc-seattle/workspace-fake
      image-file: Dockerfile
