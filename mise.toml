[settings]
lockfile = true

[tools]
node = "22"
pnpm = "10"
lefthook = "2"

[tasks.install]
description = "Install dependencies and git hooks"
run = ["pnpm install", "lefthook install", "pnpm run build"]

[tasks.build]
description = "Build the package into dist/"
run = "pnpm run build"

[tasks.format]
description = "Format and fix all files"
depends = ["build"]
run = ["pnpm exec prettier --write .", "pnpm exec eslint --fix ."]

[tasks.check]
description = "Typecheck, then check formatting and lint"
depends = ["build"]
run = ["pnpm exec tsc -p tsconfig.json", "pnpm exec prettier --check .", "pnpm exec eslint ."]

[tasks.test]
description = "Run unit tests"
depends = ["build"]
run = "pnpm exec vitest run"

[tasks.integration]
description = "Run the Gherkin integration tests against the Workspace fake"
run = "pnpm exec vitest run --config vitest.integration.config.ts"

[tasks.ci]
description = "Run all checks, unit tests, and integration tests"
depends = ["check", "test", "integration"]
